# Compila la app de iPhone (.ipa sin firmar) en una Mac de GitHub.
# Necesita los secretos TELEGRAM_API_ID y TELEGRAM_API_HASH (Settings > Secrets and variables > Actions).
# El .ipa queda en la pestaña Actions, dentro de la ejecucion, en "Artifacts".
name: iOS - IPA sin firmar

on:
  workflow_dispatch:
  push:
    branches: [sfs]
    paths:
      - 'src/**'
      - 'ios/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ios.yml'

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Revisar secretos
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          if [ -z "$TELEGRAM_API_ID" ] || [ -z "$TELEGRAM_API_HASH" ]; then
            echo "::error::Faltan los secretos TELEGRAM_API_ID y TELEGRAM_API_HASH (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Instalar dependencias
        run: |
          # Algunas dependencias vienen de GitHub por SSH; en la Mac de GitHub se bajan por HTTPS
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
          npm ci

      - name: Pruebas del motor SFS
        run: npx vitest run --config vitest.sfs.config.ts

      - name: Compilar la interfaz
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          printf 'TELEGRAM_API_ID=%s\nTELEGRAM_API_HASH=%s\n' "$TELEGRAM_API_ID" "$TELEGRAM_API_HASH" > .env
          npm run build:production
          rm .env

      - name: Preparar proyecto Xcode
        run: |
          brew install xcodegen
          rm -rf ios/web
          cp -R dist ios/web
          find ios/web -name '*.map' -delete
          rm -f ios/web/build-stats.json
          cd ios && xcodegen generate

      - name: Compilar la app
        run: |
          xcodebuild \
            -project ios/SFSApp.xcodeproj \
            -scheme SFSApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Armar el .ipa
        run: |
          VERSION=$(sed -n "s/.*SFS_APP_VERSION = '\(.*\)'.*/\1/p" src/sfs/config.ts)
          mkdir -p out/Payload
          cp -R ios/build/Build/Products/Release-iphoneos/SFSApp.app out/Payload/
          cd out
          zip -qry "SFSApp-v${VERSION}-sin-firmar.ipa" Payload
          ls -lh ./*.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: SFSApp-ipa
          path: out/*.ipa
          retention-days: 30
