# SFS App para iPhone, nativa: compila el Telegram oficial para iPhone (Telegram-iOS, GPL) con el modulo SFS.
# Necesita los secretos TELEGRAM_API_ID y TELEGRAM_API_HASH. El .ipa queda en Actions > la ejecucion > Artifacts.
# Firmado con el certificado de prueba de Telegram (fake-codesigning): se vuelve a firmar con Sideloadly/SideStore.
# El registro de cada compilacion se guarda en la rama `ci-logs` (runs/<numero>.log).
name: iOS nativo

on:
  push:
    branches: [ios-nativo]

concurrency:
  group: ios-nativo
  cancel-in-progress: true

permissions:
  contents: write

env:
  # Version de Telegram-iOS sobre la que se construye (fijada para que no cambie sola)
  TELEGRAM_IOS_COMMIT: f1dd7a2dbd02cbbf513e75d5695d8d36d1cf5838
  XCODE_APP: /Applications/Xcode_26.6.app

jobs:
  # Pruebas del cerebro SFS (Swift puro, segundos). Si fallan, no se gasta la compilacion larga
  core-tests:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Pruebas del motor SFS
        run: |
          sudo xcode-select -s "$XCODE_APP"
          cd ios/SFSModule
          set -o pipefail
          swift test 2>&1 | tee "$RUNNER_TEMP/core-tests.log"

      - name: Guardar registro de pruebas
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/core-tests.log" ] || echo "Sin registro de pruebas" > "$RUNNER_TEMP/core-tests.log"
          git clone -q --depth 1 --branch ci-logs "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" logs \
            || { git init -q -b ci-logs logs && git -C logs remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"; }
          mkdir -p logs/runs
          tail -n 600 "$RUNNER_TEMP/core-tests.log" > "logs/runs/${GITHUB_RUN_NUMBER}-tests.log"
          cd logs
          git add runs
          git -c user.name="SFS CI" -c user.email="ci@followmytg.com" commit -q -m "Pruebas ${GITHUB_RUN_NUMBER} (${{ job.status }})"
          git push -q origin HEAD:ci-logs

  build:
    needs: core-tests
    runs-on: macos-26
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
        with:
          path: sfs

      - name: Revisar secretos
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          if [ -z "$TELEGRAM_API_ID" ] || [ -z "$TELEGRAM_API_HASH" ]; then
            echo "::error::Faltan los secretos TELEGRAM_API_ID y TELEGRAM_API_HASH"
            exit 1
          fi

      - name: Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Bajar Telegram-iOS
        run: |
          git init -q telegram
          cd telegram
          git remote add origin https://github.com/TelegramMessenger/Telegram-iOS.git
          git fetch -q --depth 1 origin "$TELEGRAM_IOS_COMMIT"
          git checkout -q FETCH_HEAD
          git submodule update --init --recursive --depth 1 --jobs 8
          echo "::notice title=Telegram-iOS::$(git log -1 --format='%h %cd') | $(du -sh . | cut -f1)"

      - name: Aplicar el modulo SFS
        run: |
          if [ -x sfs/ios/apply.sh ]; then
            sfs/ios/apply.sh "$PWD/telegram"
          else
            echo "Sin cambios SFS todavia (fase 0: Telegram tal cual)"
          fi

      - name: Configuracion
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          # El identificador tiene que coincidir con los perfiles de prueba de Telegram; Sideloadly lo cambia al firmar
          python3 - <<'PY'
          import json, os
          config = {
              "bundle_id": "ph.telegra.Telegraph",
              "api_id": os.environ["TELEGRAM_API_ID"],
              "api_hash": os.environ["TELEGRAM_API_HASH"],
              "team_id": "C67CF9S4VU",
              "app_center_id": "0",
              "is_internal_build": "false",
              "is_appstore_build": "false",
              "appstore_id": "0",
              "app_specific_url_scheme": "sfsapp",
              "premium_iap_product_id": "",
              "enable_siri": False,
              "enable_icloud": False,
          }
          with open(os.path.expanduser("~/sfs-configuration.json"), "w") as f:
              json.dump(config, f)
          PY

      - name: Certificado de prueba (llavero temporal)
        working-directory: telegram/build-system/Make
        run: |
          python3 -c "import ImportCertificates; ImportCertificates.import_certificates('../fake-codesigning/certs')"
          security set-key-partition-list -S apple-tool:,apple: -s -k secret temp.keychain > /dev/null
          security find-identity -v -p codesigning

      - name: Restaurar cache de compilacion
        uses: actions/cache/restore@v4
        with:
          path: ~/telegram-bazel-cache
          key: bazel-${{ env.TELEGRAM_IOS_COMMIT }}-${{ github.run_number }}
          restore-keys: |
            bazel-${{ env.TELEGRAM_IOS_COMMIT }}-

      - name: Compilar
        working-directory: telegram
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          python3 build-system/Make/Make.py \
            --cacheDir="$HOME/telegram-bazel-cache" \
            --bazelArguments="--jobs=3 --local_resources=memory=HOST_RAM*0.75" \
            build \
            --configurationPath="$HOME/sfs-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --buildNumber="$GITHUB_RUN_NUMBER" \
            --configuration=release_arm64 \
            --outputBuildArtifactsPath="$GITHUB_WORKSPACE/out" \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Guardar cache de compilacion
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/telegram-bazel-cache
          key: bazel-${{ env.TELEGRAM_IOS_COMMIT }}-${{ github.run_number }}

      - name: Armar el .ipa
        run: |
          VERSION=$(sed -n 's/.*"app": *"\([^"]*\)".*/\1/p' telegram/versions.json)
          mv out/Telegram.ipa "out/SFSApp-nativo-tg${VERSION}-${GITHUB_RUN_NUMBER}.ipa"
          echo "::notice title=IPA::$(ls -lh out/*.ipa | awk '{print $5, $9}')"

      - uses: actions/upload-artifact@v4
        with:
          name: SFSApp-nativo-ipa
          path: out/*.ipa
          retention-days: 30

      - name: Resumen del error
        if: failure()
        run: |
          if [ -f build.log ]; then
            grep -nE "error:|ERROR:|FAILED|fatal" build.log | tail -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' > errors.txt || true
            echo "::error title=Errores de compilacion::$(cat errors.txt)"
          fi

      - name: Guardar el registro en la rama ci-logs
        if: always()
        run: |
          [ -f build.log ] || echo "Sin registro de compilacion (fallo antes de compilar)" > build.log
          git clone -q --depth 1 --branch ci-logs "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" logs \
            || { git init -q -b ci-logs logs && git -C logs remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"; }
          mkdir -p logs/runs
          tail -n 4000 build.log > "logs/runs/${GITHUB_RUN_NUMBER}.log"
          cd logs
          git add runs
          git -c user.name="SFS CI" -c user.email="ci@followmytg.com" commit -q -m "Registro de la compilacion ${GITHUB_RUN_NUMBER} (${{ job.status }})"
          git push -q origin HEAD:ci-logs
